<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reviewer</title>
  <script>
    (function() {
      var stored = localStorage.getItem('reviewer-theme');
      if (stored === 'dark' || (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/highlight.css">
</head>
<body>
  <header class="top-bar">
    <a href="#/" class="logo">Reviewer</a>
    <span class="top-bar-spacer"></span>
    <button class="theme-toggle-topbar" id="theme-toggle-topbar" title="Toggle dark mode" aria-label="Toggle dark mode"></button>
  </header>
  <main id="app"></main>
  <script type="module" src="/views.js"></script>
</body>
</html>
